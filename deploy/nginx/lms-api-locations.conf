# Include inside the existing HTTPS server block for lms.dolphinxstudio.com.
# Install the companion limits file once in /etc/nginx/conf.d/.
# Preserve the backend upload, readiness and sensitive-URL safeguards.

# Readiness performs a disk fsync/statfs and a bounded scanner version
# probe. Keep it local to the deploy/load-balancer agent.
location = /api/v1/ready {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

# Authenticated avatar/logo uploads. Nest streams the raw request through
# ClamAV and Sharp; Nginx must not buffer it to its own temporary storage.
location = /api/v1/users/me/avatar {
    client_max_body_size 6m;
    client_body_timeout 60s;
    limit_req zone=lms_same_origin_public_image_upload burst=4 nodelay;
    limit_conn lms_same_origin_upload_connections 2;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

location = /api/v1/organizations/current/logo {
    client_max_body_size 6m;
    client_body_timeout 60s;
    limit_req zone=lms_same_origin_public_image_upload burst=4 nodelay;
    limit_conn lms_same_origin_upload_connections 2;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

location ~ "^/api/v1/organizations/[0-9a-fA-F]{24}/logo$" {
    client_max_body_size 6m;
    client_body_timeout 60s;
    limit_req zone=lms_same_origin_public_image_upload burst=4 nodelay;
    limit_conn lms_same_origin_upload_connections 2;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

# Signed header upload. 101 MiB leaves a small proxy margin above the
# default 100 MiB lesson limit while Nest still enforces the signed length.
location = /api/v1/media/local/upload {
    client_max_body_size 101m;
    client_body_timeout 300s;
    limit_req zone=lms_same_origin_private_media_upload burst=20 nodelay;
    limit_conn lms_same_origin_upload_connections 2;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# The signed GET ticket is a query parameter. Never write it to an access
# log; it remains private and short-lived. Range is forwarded for seeking.
location = /api/v1/media/local/download {
    access_log off;
    # Upstream error entries can also include the full request URI.
    error_log /dev/null crit;
    proxy_buffering off;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

# SePay IPN payloads are small and never contain assessment authoring data.
location = /api/v1/billing/ipn {
    client_max_body_size 256k;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# OAuth authorization code/state nằm trong query string. Không ghi callback
# URI vào access/error log; Nest tự đổi sang redirect frontend no-store.
location = /api/v1/integrations/google-drive/callback {
    access_log off;
    error_log /dev/null crit;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# YouTube OAuth code/state cũng nằm trong query string. Exact location này
# không log URI nhạy cảm và không cho callback giữ upstream vô thời hạn.
location = /api/v1/integrations/youtube/callback {
    access_log off;
    error_log /dev/null crit;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# Keep the entire /api/v1 path when forwarding to NestJS.
# Do not use ^~: the organization-logo regex above must still match.
location /api/v1/ {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
