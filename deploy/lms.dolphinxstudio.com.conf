# Replace /etc/nginx/sites-available/lms.dolphinxstudio.com with this file.
# Ubuntu includes sites-enabled/* inside http {}, where these zones belong.
limit_req_zone $binary_remote_addr zone=lms_full_image_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lms_full_media_upload:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=lms_full_upload_connections:10m;

server {
    listen 443 ssl; # managed by Certbot
    server_name lms.dolphinxstudio.com;

    ssl_certificate /etc/letsencrypt/live/lms.dolphinxstudio.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lms.dolphinxstudio.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 120m;
    limit_req_status 429;
    limit_conn_status 429;

    # Common upstream settings. API locations inherit all of these headers.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Keep readiness private, including the optional trailing slash.
    location ~ "^/api/v1/ready/?$" {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;

        proxy_pass http://127.0.0.1:4000;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Avatar and organization logos: 6 MiB proxy limit, streamed to BE.
    location ~ "^/api/v1/(users/me/avatar|organizations/(current|[0-9a-fA-F]{24})/logo)/?$" {
        client_max_body_size 6m;
        client_body_timeout 60s;
        limit_req zone=lms_full_image_upload burst=4 nodelay;
        limit_conn lms_full_upload_connections 2;
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:4000;
    }

    location ~ "^/api/v1/media/local/upload/?$" {
        client_max_body_size 101m;
        client_body_timeout 300s;
        limit_req zone=lms_full_media_upload burst=20 nodelay;
        limit_conn lms_full_upload_connections 2;
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:4000;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Signed download URLs must not appear in access/error logs.
    location ~ "^/api/v1/media/local/download/?$" {
        access_log off;
        error_log /dev/null crit;
        proxy_buffering off;

        proxy_pass http://127.0.0.1:4000;
    }

    location ~ "^/api/v1/billing/ipn/?$" {
        client_max_body_size 256k;

        proxy_pass http://127.0.0.1:4000;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # OAuth code/state are sensitive query parameters; do not log callbacks.
    location ~ "^/api/v1/integrations/(google-drive|youtube)/callback/?$" {
        access_log off;
        error_log /dev/null crit;

        proxy_pass http://127.0.0.1:4000;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # No trailing slash on proxy_pass: preserve the complete /api/v1/ path.
    # Do not use ^~ here, because it would bypass the protected regex routes.
    location /api/v1/ {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:4000;
    }

    # Frontend UI.
    location / {
        proxy_pass http://127.0.0.1:3000;

        # A child proxy_set_header overrides the inherited set: repeat all.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name lms.dolphinxstudio.com;

    if ($host = lms.dolphinxstudio.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}
