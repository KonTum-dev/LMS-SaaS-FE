# HTTP bootstrap template. For an existing HTTPS site, preserve its TLS config
# and add only the API include to the active 443 server; see same-domain-pm2.md.
# Install nginx/lms-api-limits.conf in /etc/nginx/conf.d/ first (HTTP context).
server {
    listen 80;
    listen [::]:80;

    server_name lms.dolphinxstudio.com;

    access_log /var/log/nginx/lms-frontend.access.log;
    error_log /var/log/nginx/lms-frontend.error.log;

    # Browser -> public HTTPS /api/v1/... -> internal NestJS 127.0.0.1:4000.
    include /etc/nginx/snippets/lms-api-locations.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
