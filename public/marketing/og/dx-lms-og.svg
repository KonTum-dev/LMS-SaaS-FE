<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="dxLmsOgTitle dxLmsOgDescription">
  <title id="dxLmsOgTitle">DX LMS — Một hệ thống cho mọi quy mô đào tạo</title>
  <desc id="dxLmsOgDescription">Ảnh chia sẻ của DX LMS với biểu tượng cá heo, trang sách và bản xem trước không gian đào tạo.</desc>
  <defs>
