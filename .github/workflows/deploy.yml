name: Frontend CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    frontend-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate production build configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const value = process.env.NEXT_PUBLIC_API_URL ?? "";
          let url;

          try {
            url = new URL(value);
          } catch {
            console.error(
              "::error::Repository variable NEXT_PUBLIC_API_URL must be a valid HTTPS URL ending in /api/v1.",
            );
            process.exit(1);
          }

          if (
            url.protocol !== "https:" ||
            !url.hostname ||
            url.username ||
            url.password ||
            url.pathname !== "/api/v1" ||
            url.search ||
            url.hash
          ) {
            console.error(
              "::error::Repository variable NEXT_PUBLIC_API_URL must match https://<host>/api/v1 without credentials, query, fragment, or trailing slash.",
            );
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Package standalone release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: package
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          test -s .next/standalone/server.js

          cp -a public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/
          printf '%s\n' "$RELEASE_ID" > .next/standalone/REVISION

          archive="${RUNNER_TEMP}/lms-frontend-${RELEASE_ID}.tar.gz"
          tar -C .next/standalone -czf "$archive" .

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Configure deployment SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: ssh
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Repository secret $name is required for deployment."
              exit 1
            fi
          done

          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST must be an IPv4 address or DNS hostname."
            exit 1
          fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] ||
            (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT must be between 1 and 65535."
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::DEPLOY_USER is not a valid Linux username."
            exit 1
          fi

          ssh_dir="${RUNNER_TEMP}/deploy-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_deploy" "$ssh_dir/known_hosts"

          if ! ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" \
            -f "$ssh_dir/known_hosts" >/dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS does not contain [$DEPLOY_HOST]:$DEPLOY_PORT."
            exit 1
          fi

          echo "key=$ssh_dir/id_deploy" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"

      - name: Upload release tarball
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ steps.ssh.outputs.key }}
          DEPLOY_KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -Eeuo pipefail
          remote_archive="/srv/lms/frontend/releases/.frontend-${RELEASE_ID}.tar.gz"
          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$DEPLOY_KNOWN_HOSTS_FILE"
            -o ConnectTimeout=15
          )

          scp "${ssh_options[@]}" \
            -P "$DEPLOY_PORT" \
            -i "$DEPLOY_KEY" \
            "$RELEASE_ARCHIVE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"

      - name: Activate release and verify health
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ steps.ssh.outputs.key }}
          DEPLOY_KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$DEPLOY_KNOWN_HOSTS_FILE"
            -o ConnectTimeout=15
          )

          ssh "${ssh_options[@]}" \
            -p "$DEPLOY_PORT" \
            -i "$DEPLOY_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$RELEASE_ID'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          release_id="$1"
          base_dir="/srv/lms/frontend"
          releases_dir="$base_dir/releases"
          release_dir="$releases_dir/$release_id"
          archive="$releases_dir/.frontend-${release_id}.tar.gz"
          current_link="$base_dir/current"
          candidate_link="$base_dir/.current-${release_id}"

          case "$release_id" in
            "" | *[!a-f0-9-]*)
              echo "Invalid release identifier: $release_id" >&2
              exit 1
              ;;
          esac

          if [[ ! -f "$archive" || -L "$archive" ]]; then
            echo "Release archive is missing or unsafe: $archive" >&2
            exit 1
          fi
          if [[ -e "$release_dir" || -L "$release_dir" ]]; then
            echo "Release directory already exists: $release_dir" >&2
            exit 1
          fi
          if [[ -e "$current_link" && ! -L "$current_link" ]]; then
            echo "Current path exists but is not a symbolic link: $current_link" >&2
            exit 1
          fi

          previous_target=""
          if [[ -L "$current_link" ]]; then
            previous_target="$(readlink -- "$current_link")"
          fi

          install -d -m 2750 "$release_dir"
          tar --extract \
            --gzip \
            --file "$archive" \
            --directory "$release_dir" \
            --no-same-owner \
            --no-same-permissions
          unlink -- "$archive"

          if [[ ! -s "$release_dir/server.js" ]]; then
            echo "Standalone server.js is missing from $release_dir." >&2
            exit 1
          fi

          chmod -R g+rX,o-rwx "$release_dir"
          install -d -m 2770 "$release_dir/.next/cache"

          rollback() {
            echo "Deployment failed; restoring the previous frontend release." >&2
            if [[ -n "$previous_target" ]]; then
              rollback_link="$base_dir/.rollback-${release_id}"
              ln -s -- "$previous_target" "$rollback_link"
              mv -Tf -- "$rollback_link" "$current_link"
              sudo /usr/bin/systemctl restart lms-frontend.service || true
            else
              unlink -- "$current_link" 2>/dev/null || true
              sudo /usr/bin/systemctl restart lms-frontend.service || true
            fi
          }

          ln -s -- "$release_dir" "$candidate_link"
          mv -Tf -- "$candidate_link" "$current_link"

          if ! sudo /usr/bin/systemctl restart lms-frontend.service; then
            rollback
            exit 1
          fi

          healthy=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/ >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "$healthy" != "true" ]]; then
            rollback
            exit 1
          fi

          echo "Frontend release $release_id is healthy."
          REMOTE_SCRIPT
